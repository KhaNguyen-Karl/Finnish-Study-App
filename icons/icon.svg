<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003580"/>
      <stop offset="100%" stop-color="#0052cc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#grad)"/>
  <!-- Nordic Cross White Outline -->
  <rect x="170" y="70" width="60" height="372" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="210" width="372" height="60" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Central Flame / Talk Indicator -->
  <circle cx="370" cy="140" r="50" fill="#f59e0b" filter="url(#shadow)"/>
  <path d="M 370 110 C 375 125, 395 135, 370 170 C 345 135, 365 125, 370 110 Z" fill="#ffffff"/>
  <!-- Subtitle Text -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">SUOMIPOLKU</text>
</svg>